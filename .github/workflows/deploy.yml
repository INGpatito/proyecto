name: Deploy to Orange Pi

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux
    env:
      APP_DIR: /home/orangepi/proyecto

    steps:
      - name: Sync code to project directory
        shell: bash
        run: |
          set -e

          # Si ya es un repo git, solo actualizar
          if [ -d "$APP_DIR/.git" ]; then
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
          else
            # Si el directorio existe pero no es git, inicializar
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            git init
            git remote add origin "https://github.com/${{ github.repository }}.git" 2>/dev/null || git remote set-url origin "https://github.com/${{ github.repository }}.git"
            git fetch origin main
            git reset --hard origin/main
          fi

          echo "✅ Código sincronizado: $(git log --oneline -1)"

      - name: Install dependencies in venv (if requirements.txt exists)
        shell: bash
        run: |
          set -e
          cd "$APP_DIR"

          if [ -f "requirements.txt" ]; then
            if [ ! -f "venv/bin/pip" ] || ! venv/bin/pip --version &>/dev/null; then
              echo "Creando venv limpio..."
              python3 -m venv --clear venv
            fi

            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            echo "✅ Dependencias instaladas"
          else
            echo "ℹ️  No hay requirements.txt, saltando instalación de dependencias"
          fi

      - name: Run deploy script (if exists)
        shell: bash
        run: |
          set -e
          if [ -f "$APP_DIR/deploy.sh" ]; then
            chmod +x "$APP_DIR/deploy.sh"
            cd "$APP_DIR"
            [ -f "venv/bin/activate" ] && source venv/bin/activate
            ./deploy.sh
          fi

      - name: Restart service (if exists)
        shell: bash
        run: |
          set -e
          SERVICE_NAME="proyecto.service"
          if systemctl list-unit-files | grep -q "$SERVICE_NAME"; then
            sudo systemctl restart "$SERVICE_NAME"
            echo "✅ Servicio $SERVICE_NAME reiniciado"
          else
            echo "ℹ️  Servicio $SERVICE_NAME no configurado aún, saltando..."
          fi
