name: Deploy to Orange Pi

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux
    env:
      APP_DIR: /home/orangepi/proyecto

    steps:
      - name: Sync code to project directory
        shell: bash
        run: |
          set -e

          # Si no existe el repo clonado, clonarlo
          if [ ! -d "$APP_DIR/.git" ]; then
            mkdir -p "$APP_DIR"
            git clone "https://github.com/${{ github.repository }}.git" "$APP_DIR"
          fi

          # Actualizar al último commit de main
          cd "$APP_DIR"
          git fetch origin main
          git reset --hard origin/main

      - name: Install dependencies in venv
        shell: bash
        run: |
          set -e
          cd "$APP_DIR"

          # Crear venv si no existe
          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi

          # Instalar/actualizar dependencias
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run deploy script (if exists)
        shell: bash
        run: |
          set -e
          if [ -f "$APP_DIR/deploy.sh" ]; then
            chmod +x "$APP_DIR/deploy.sh"
            cd "$APP_DIR"
            source venv/bin/activate
            ./deploy.sh
          fi

      - name: Restart service (if exists)
        shell: bash
        run: |
          set -e
          SERVICE_NAME="proyecto.service"
          if systemctl list-unit-files | grep -q "$SERVICE_NAME"; then
            sudo systemctl restart "$SERVICE_NAME"
            echo "✅ Servicio $SERVICE_NAME reiniciado"
          else
            echo "ℹ️  Servicio $SERVICE_NAME no configurado aún, saltando..."
          fi
