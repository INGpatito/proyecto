<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papoys - Estacionamiento</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }
        .container {
            text-align: center;
            animation: fadeIn 1s ease-in;
        }
        h1 {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #40E0D0, #6C63FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.3rem;
            opacity: 0.8;
        }
        .badge {
            margin-top: 2rem;
            padding: 8px 20px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            display: inline-block;
            font-size: 0.85rem;
            opacity: 0.6;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🅿️ Hola Mundo</h1>
        <p>Sistema de Estacionamiento Papoys</p>
        <div class="badge">🍊 Powered by Orange Pi 4 Pro</div>
    </div>
</body>
</html>
